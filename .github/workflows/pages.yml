name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build:pages
      - name: Check out the Arizona version
        uses: actions/checkout@v4
        with:
          ref: sonoran-roundtrip
          path: arizona-src
      - name: Build the Arizona version at /arizona/
        working-directory: arizona-src
        env:
          BASE_PATH: /winter-trip-2026/arizona
        run: |
          npm ci
          npm run build:pages
      - name: Add the Arizona version to the site
        run: |
          mkdir -p out/arizona
          cp -R arizona-src/out/. out/arizona/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
